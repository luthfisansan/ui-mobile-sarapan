<title>Digital Breakfast Planner</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: panel presentasi di kiri (status akun, lompat layar, simulasi petugas), perangkat 390x844 di kanan.
   Satu tampilan terang yang sama dengan desain Figma, jadi tidak ada varian gelap. */
:root{
  --green:#17624B; --green-dk:#0E4535; --green-lt:#DCEFE6;
  --orange:#F2A33A; --orange-lt:#FDF0D9; --orange-dk:#7A4A06;
  --bg:#F5F7F2; --card:#FFFFFF; --line:#D5DED8; --line-in:#B9C7BF;
  --ink:#14261F; --muted:#55655D; --ph:#66766E; --track:#E4EBE6;
  --red:#A83B2A; --red-lt:#FBE6E1;
  --stage:#E6ECE7; --panel:#FFFFFF;
  --font:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--stage); color:var(--ink); font-family:var(--font); font-size:14px;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:24px; min-height:100vh;
  display:flex; flex-wrap:wrap; gap:32px; justify-content:center; align-items:flex-start;
}
button{font-family:inherit}
:focus-visible{outline:3px solid var(--orange); outline-offset:2px}

/* ---------- Panel presentasi ---------- */
.panel{width:320px; max-width:100%; background:var(--panel); border:1px solid var(--line); border-radius:20px; padding:20px; display:flex; flex-direction:column; gap:16px; order:1}
.panel h1{margin:0; font-size:20px; line-height:1.2; font-weight:800; letter-spacing:-.3px; text-wrap:balance}
.panel .sub{margin:4px 0 0; color:var(--muted); font-size:13px; line-height:1.45}
.panel h2{margin:0 0 10px; font-size:11px; font-weight:700; letter-spacing:.7px; text-transform:uppercase; color:var(--muted)}
.stat{display:grid; gap:6px}
.stat-row{display:flex; align-items:center; gap:10px; font-size:13px; font-weight:600; color:var(--muted)}
.stat-row i{width:22px; height:22px; border-radius:11px; border:2px solid var(--line-in); display:inline-flex; align-items:center; justify-content:center; flex:none; font-style:normal; font-size:11px; font-weight:800}
.stat-row.done{color:var(--ink)} .stat-row.done i{background:var(--green); border-color:var(--green); color:#fff}
.stat-row.now{color:var(--orange-dk)} .stat-row.now i{background:var(--orange-lt); border-color:var(--orange); color:var(--orange-dk)}
.stat-row code{margin-left:auto; font:600 10.5px ui-monospace,Menlo,Consolas,monospace; color:var(--muted)}
.jump{display:grid; gap:2px}
.jump .grp{margin:8px 0 2px; font-size:11px; font-weight:700; letter-spacing:.7px; text-transform:uppercase; color:var(--muted)}
.jump button,.tool{display:flex; align-items:center; gap:10px; width:100%; min-height:36px; padding:6px 12px; border-radius:10px; border:1px solid transparent; background:transparent; font-size:13.5px; font-weight:600; color:var(--ink); text-align:left; cursor:pointer}
.jump button:hover{background:var(--bg)}
.jump button[aria-current="true"]{background:var(--green-lt); color:var(--green-dk); border-color:#B9DCCB; font-weight:700}
.jump .n{width:22px; height:22px; border-radius:7px; background:var(--bg); display:inline-flex; align-items:center; justify-content:center; font-size:11px; font-weight:800; color:var(--muted); flex:none}
.jump button[aria-current="true"] .n{background:var(--green); color:#fff}
.tools{display:grid; gap:8px}
.tool{border-color:var(--line-in); background:#fff; justify-content:center; font-weight:700}
.tool:hover:not(:disabled){background:var(--bg)}
.tool.primary{background:var(--green); border-color:var(--green); color:#fff}
.tool.primary:hover:not(:disabled){background:var(--green-dk)}
.tool:disabled{opacity:.5; cursor:not-allowed}
.hint{margin:0; font-size:12px; line-height:1.45; color:var(--muted)}

/* ---------- Perangkat ---------- */
.stage{order:2; flex:none}
.stage-box{position:relative; width:calc(410px*var(--s,1)); height:calc(864px*var(--s,1))}
.device{position:absolute; left:0; top:0; width:410px; height:864px; padding:10px; border-radius:46px; background:#14261F; transform:scale(var(--s,1)); transform-origin:0 0; box-shadow:0 24px 60px rgba(20,38,31,.28)}
.phone{position:relative; width:390px; height:844px; border-radius:36px; overflow:hidden; background:var(--bg); color:var(--ink)}
.scr{height:100%; display:flex; flex-direction:column}
.body{flex:1; min-height:0; overflow-y:auto; padding:52px 24px 24px; display:flex; flex-direction:column; gap:20px; scrollbar-width:thin}
.body.tight{padding-top:20px}
.foot{flex:none; padding:12px 24px 28px; display:flex; flex-direction:column; gap:10px; background:var(--bg); border-top:1px solid var(--line)}
.row{display:flex; gap:12px}
h1.t{margin:0; font-size:24px; line-height:1.2; font-weight:800; letter-spacing:-.3px; text-wrap:balance}
h1.t.xl{font-size:30px; line-height:1.15; letter-spacing:-.5px}
.lead{margin:0; font-size:15px; line-height:1.5; color:var(--muted)}
.cap{font-size:12px; font-weight:700; letter-spacing:.6px; text-transform:uppercase; color:var(--green)}
.steps{display:flex; gap:8px} .steps i{flex:1; height:6px; border-radius:3px; background:#D5DED8} .steps i.on{background:var(--green)}
.card{background:var(--card); border:1px solid var(--line); border-radius:20px; padding:22px; display:flex; flex-direction:column; gap:16px}
.card.sm{border-radius:18px; padding:16px; gap:12px}
.field{display:flex; flex-direction:column; gap:8px}
.field>label,.field>.lbl{font-size:14px; font-weight:600}
.inp{height:52px; border:1.5px solid var(--line-in); border-radius:14px; padding:0 16px; font:500 16px var(--font); color:var(--ink); background:#fff; width:100%}
.inp::placeholder{color:var(--ph)}
.inp:focus{outline:none; border-color:var(--green); box-shadow:0 0 0 3px var(--green-lt)}
.inp.bad{border-color:var(--red)}
.inp.sm{height:44px; border-radius:10px; font-size:14px; font-weight:600; padding:0 12px}
.wrap{position:relative} .wrap svg{position:absolute; right:16px; top:16px; pointer-events:none}
.err{margin:0; font-size:12.5px; color:var(--red); font-weight:600}
.seg{display:flex; gap:8px}
.seg button,.chip{flex:1; min-height:48px; border-radius:12px; border:1.5px solid var(--line-in); background:#fff; font:600 14px var(--font); color:var(--ink); cursor:pointer; padding:0 8px}
.seg button[aria-pressed="true"],.chip[aria-pressed="true"]{background:var(--green); border-color:var(--green); color:#fff; font-weight:700}
.chips{display:flex; flex-wrap:wrap; gap:8px}
.chip{flex:none; min-height:40px; padding:0 14px; border-radius:999px; font-size:13.5px}
.btn{display:flex; align-items:center; justify-content:center; gap:8px; min-height:56px; border-radius:16px; border:none; background:var(--green); color:#fff; font:700 16px var(--font); cursor:pointer; width:100%; text-decoration:none}
.btn:hover:not(:disabled){background:var(--green-dk)}
.btn:disabled{background:#B9C7BF; color:#F5F7F2; cursor:not-allowed}
.btn.line{background:#fff; color:var(--ink); border:1.5px solid var(--line-in)}
.btn.line:hover:not(:disabled){background:var(--bg)}
.btn.amber{background:var(--orange); color:#2B1A02; font-weight:800; min-height:50px; border-radius:14px; font-size:15px}
.btn.amber:hover{background:#E59A2E}
.btn.ghost{background:transparent; border:1.5px dashed var(--green); color:var(--green); min-height:48px; border-radius:14px; font-size:14px}
.btn.ghost:hover{background:var(--green-lt)}
.btn.outline{background:#fff; border:1.5px solid var(--green); color:var(--green); min-height:50px; border-radius:14px; font-size:15px}
.btn.outline:hover{background:var(--green-lt)}
.btn.fit{width:auto; padding:0 22px}
.link{background:none; border:none; color:var(--green); font:700 14px var(--font); cursor:pointer; padding:6px 4px; text-decoration:underline; text-underline-offset:3px}
.center{text-align:center; font-size:14px; color:var(--muted)}
.pill{display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:700; padding:5px 10px; border-radius:999px; white-space:nowrap}
.pill.ok{background:var(--green-lt); color:var(--green-dk)} .pill.warn{background:var(--orange-lt); color:var(--orange-dk)} .pill.mute{background:#EBF0EC; color:var(--muted)} .pill.bad{background:var(--red-lt); color:var(--red)}
.logo{width:64px; height:64px; border-radius:20px; background:var(--green); display:flex; align-items:center; justify-content:center}
.ico{width:48px; height:48px; border-radius:14px; background:var(--green-lt); display:flex; align-items:center; justify-content:center; flex:none}
.opt{display:flex; align-items:center; gap:14px; min-height:60px; padding:12px 16px; border-radius:16px; border:1.5px solid var(--line); background:#fff; font:600 15px var(--font); color:var(--ink); text-align:left; cursor:pointer; width:100%}
.opt .dot{width:24px; height:24px; border-radius:12px; border:2px solid var(--line-in); flex:none; display:flex; align-items:center; justify-content:center}
.opt[aria-pressed="true"]{border:2px solid var(--green); background:var(--green-lt); color:var(--green-dk); font-weight:700; padding:11px 15px}
.opt[aria-pressed="true"] .dot{background:var(--green); border-color:var(--green)}
.bar{height:10px; border-radius:5px; background:var(--track); overflow:hidden} .bar i{display:block; height:100%; border-radius:5px; background:var(--green)}
.bar.thin{height:6px;border-radius:3px}
.bk{display:flex; gap:14px; align-items:center; text-align:left; width:100%; background:#fff; border:1px solid var(--line); border-radius:18px; padding:14px; cursor:pointer; font-family:inherit; color:inherit}
.bk:hover{border-color:var(--line-in); background:#FBFCFA}
.bk .num{width:48px; height:48px; border-radius:14px; background:var(--green-lt); color:var(--green-dk); display:flex; flex-direction:column; align-items:center; justify-content:center; flex:none; font-weight:800; font-size:20px; line-height:1}
.bk .num small{font-size:9px; font-weight:700; letter-spacing:.5px; margin-bottom:2px}
.mk{width:28px; height:28px; border-radius:14px; border:2px solid var(--line-in); flex:none; display:flex; align-items:center; justify-content:center; box-sizing:border-box}
.mk.on{background:var(--green); border-color:var(--green); color:#fff}
.bk .tx{display:flex; flex-direction:column; gap:3px; flex:1; min-width:0}
.bk .tx strong{font-size:15px; line-height:1.3} .bk .tx span{font-size:12.5px; color:var(--muted)}

/* Bottom nav */
.nav{flex:none; height:76px; border-top:1px solid var(--line); background:#fff; display:flex; padding:0 4px}
.nav button{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; background:none; border:none; font:600 11.5px var(--font); color:var(--muted); cursor:pointer; min-width:0}
.nav button[aria-current="page"]{color:var(--green); font-weight:800}

/* Reader */
.rtop{flex:none; padding:48px 16px 10px; background:var(--bg); display:flex; flex-direction:column; gap:10px; border-bottom:1px solid var(--line)}
.rtop .r1{display:flex; align-items:center; gap:4px}
.rtop .r1 button{display:flex; align-items:center; gap:4px; min-height:44px; padding:0 10px 0 4px; border:none; background:none; color:var(--green); font:700 14px var(--font); cursor:pointer}
.rtop .r1 span{margin-left:auto; font-size:12.5px; font-weight:600; color:var(--muted); padding-right:8px}
.secnav{display:flex; gap:8px; overflow-x:auto; padding:2px 24px 4px; margin:0 -24px; scrollbar-width:none}
.secnav::-webkit-scrollbar{display:none}
.secnav button{flex:none; min-height:36px; padding:0 12px; border-radius:999px; border:1.5px solid var(--line-in); background:#fff; font:700 12.5px var(--font); color:var(--green-dk); cursor:pointer}
.sec{display:flex; flex-direction:column; gap:14px; scroll-margin-top:8px}
.sec h2{margin:0; font-size:19px; line-height:1.3; font-weight:800; letter-spacing:-.2px; text-wrap:balance}
.sec h2 em{font-style:normal; color:var(--green); margin-right:6px}
.sec p{margin:0; font-size:15px; line-height:1.6}
.callout{border-radius:16px; padding:16px; display:flex; flex-direction:column; gap:6px; background:var(--orange-lt); color:#3F2603}
.callout b{font-size:11.5px; letter-spacing:.7px; text-transform:uppercase; color:var(--orange-dk)}
.callout p{font-size:14.5px; line-height:1.55}
.callout.green{background:var(--green-lt); color:var(--green-dk)} .callout.green b{color:var(--green)}
.sub3{font-size:13px; font-weight:700; margin:0 0 8px}
.ul{margin:0; padding-left:20px; display:grid; gap:6px; font-size:15px; line-height:1.5}
.ol{margin:0; padding:0; list-style:none; display:grid; gap:10px; counter-reset:o}
.ol li{counter-increment:o; display:flex; gap:12px; font-size:15px; line-height:1.5}
.ol li::before{content:counter(o); flex:none; width:26px; height:26px; border-radius:13px; background:var(--green); color:#fff; font-weight:800; font-size:13px; display:flex; align-items:center; justify-content:center; margin-top:-1px}
.tbl{width:100%; border-collapse:collapse; font-size:13.5px}
.tbl th{text-align:left; font-size:11.5px; letter-spacing:.5px; text-transform:uppercase; color:var(--muted); padding:8px 10px; border-bottom:1.5px solid var(--line)}
.tbl td{padding:10px; border-bottom:1px solid var(--line); vertical-align:top; line-height:1.4}
.tbl td:first-child{font-weight:700}
.mf{display:grid; gap:8px}
.mf div{display:grid; grid-template-columns:1fr; gap:6px}
.mf .m{background:var(--red-lt); color:#6E2417; border-radius:12px; padding:10px 14px; font-size:14px; line-height:1.45}
.mf .f{background:var(--green-lt); color:var(--green-dk); border-radius:12px; padding:10px 14px; font-size:14px; line-height:1.45}
.mf b{display:block; font-size:10.5px; letter-spacing:.8px; margin-bottom:2px}
.stats{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.stats div{background:#fff; border:1px solid var(--line); border-radius:14px; padding:12px 14px; display:flex; flex-direction:column; gap:2px}
.stats strong{font-size:22px; font-weight:800; color:var(--green)} .stats span{font-size:12.5px; color:var(--muted); line-height:1.35}
.menus{display:grid; gap:10px}
.menus div{background:#fff; border:1px solid var(--line); border-radius:14px; padding:12px 14px}
.menus strong{display:block; font-size:14px; margin-bottom:4px; color:var(--green-dk)} .menus span{font-size:13.5px; line-height:1.5; color:var(--ink)}
.src{margin:0; font-size:12px; line-height:1.5; color:var(--muted)}
.foodcard .stt{display:flex; gap:6px} .foodcard .stt button{flex:1; min-height:40px; border-radius:10px; border:1.5px solid var(--line-in); background:#fff; font:600 12.5px var(--font); color:var(--ink); cursor:pointer; padding:0 4px}
.foodcard .stt button[aria-pressed="true"].s{background:var(--green); border-color:var(--green); color:#fff}
.foodcard .stt button[aria-pressed="true"].d{background:var(--orange); border-color:var(--orange); color:#2B1A02}
.foodcard .stt button[aria-pressed="true"].t{background:var(--ink); border-color:var(--ink); color:#fff}
.foodcard.off .inp{background:#EEF2EF; color:var(--muted)}
.days{display:flex; justify-content:space-between; gap:4px}
.day{flex:1; display:flex; flex-direction:column; align-items:center; gap:6px; background:none; border:none; cursor:pointer; font:600 12px var(--font); color:var(--ink); padding:4px 0; border-radius:12px}
.day[aria-pressed="true"]{background:var(--green-lt)}
.dot2{width:38px; height:38px; border-radius:19px; display:flex; align-items:center; justify-content:center; box-sizing:border-box}
.dot2.s{background:var(--green)} .dot2.p{background:var(--orange)} .dot2.x{background:var(--red)} .dot2.n{border:2px dashed #8FA196}
.legend{display:flex; gap:14px; flex-wrap:wrap; font-size:12px; color:var(--muted)} .legend span{display:flex; align-items:center; gap:6px}
.legend i{width:10px; height:10px; border-radius:5px; display:inline-block}
.tabs{display:flex; gap:8px} .tabs button{flex:1; min-height:44px; border-radius:12px; border:1.5px solid var(--line-in); background:#fff; font:700 13.5px var(--font); color:var(--ink); cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--green); border-color:var(--green); color:#fff}
.toast{position:absolute; left:20px; right:20px; bottom:96px; background:var(--ink); color:#fff; border-radius:14px; padding:13px 16px; font-size:14px; font-weight:600; line-height:1.4; opacity:0; transform:translateY(8px); pointer-events:none; transition:opacity .2s,transform .2s; z-index:5}
.toast.on{opacity:1; transform:none}
.big{font-size:56px; font-weight:800; letter-spacing:-1.5px; color:var(--green-dk); line-height:1}
@media (max-width:959px){ .panel{order:2; width:410px} .stage{order:1} body{gap:24px} }
@media (prefers-reduced-motion:reduce){ .toast{transition:none} }
</style>

<aside class="panel" aria-label="Panel presentasi">
  <div>
    <h1>Digital Breakfast Planner</h1>
    <p class="sub">Prototipe aplikasi siswa. Semua layar bisa diklik sesuai alur final.</p>
  </div>
  <section aria-labelledby="h-status">
    <h2 id="h-status">Status akun siswa</h2>
    <div class="stat" id="statusList"></div>
  </section>
  <section aria-labelledby="h-jump">
    <h2 id="h-jump">Lompat ke layar</h2>
    <nav class="jump" id="jumpList" aria-label="Daftar layar"></nav>
  </section>
  <section aria-labelledby="h-tools">
    <div class="tools">
      <button class="tool" id="toolFill" type="button" data-act="fill">Isi data contoh di form</button>
      <button class="tool primary" id="toolVerify" type="button" data-act="verify">Simulasi: petugas selesaikan SQ-FFQ</button>
      <button class="tool" type="button" data-act="reset">Mulai ulang dari awal</button>
    </div>
    <p class="hint" style="margin-top:10px">Di web admin, petugas mengisi SQ-FFQ. Begitu selesai, database mengubah status akun menjadi Terverifikasi dan Beranda siswa terbuka.</p>
  </section>
</aside>

<main class="stage" id="stage" aria-label="Aplikasi siswa">
  <div class="stage-box" id="stageBox">
    <div class="device">
      <div class="phone" id="phone"></div>
    </div>
  </div>
</main>

<script>
(function(){
"use strict";

/* ================= Data ================= */
const BOOKS = [
{id:1, title:"Mengenal Sarapan dan Manfaatnya", tag:"Kenapa sarapan penting untuk tenaga, semangat, dan konsentrasi belajar.", min:"4",
 src:"Sumber utama: Buku Menu Sarapan Aksi Bergizi (Kemenkes RI dan UNICEF, 2024), Bab 1, halaman 1–2.",
 goals:["Menjelaskan arti sarapan","Memahami mengapa remaja perlu sarapan","Mengenal 6 manfaat sarapan dan dampak jika dilewatkan"],
 story:{l:"Cerita pagi Rani", t:"Alarm berbunyi jam 05.30. Rani mandi, memakai seragam, lalu buru-buru memesan ojek online supaya tidak terlambat. \"Nanti beli jajan di kantin saja,\" pikirnya. Jam 09.30, pelajaran matematika baru separuh jalan, tapi perut Rani sudah keroncongan dan konsentrasinya buyar. Ia hanya memikirkan satu hal: makan apa saja yang ada di kantin."},
 secs:[
 {n:"1.1",t:"Apa Itu Sarapan?",p:["Sarapan adalah kegiatan makan pada pagi hari, sebelum kamu memulai aktivitas sehari-hari. Sarapan menjadi bagian penting dari pola makan karena membantu menyediakan zat gizi yang dibutuhkan tubuh untuk memulai hari.","Bagi remaja, sarapan perlu mendapat perhatian khusus. Masa remaja adalah periode pertumbuhan yang ditandai dengan perubahan fisik dan mental, serta kebutuhan gizi yang meningkat."],chips:["Dimakan pagi hari","Sebelum beraktivitas","Gizi untuk tubuh"],co:{l:"Tahukah kamu?",t:"Tubuhmu seperti ponsel yang dipakai seharian. Semalaman tubuh beristirahat, dan sarapan ibarat mengisi daya sebelum kamu memulai hari yang panjang."}},
 {n:"1.2",t:"Mengapa Sarapan Penting bagi Remaja?",p:["Masa remaja adalah salah satu periode penting dalam pertumbuhan. Pada masa ini terjadi percepatan pertumbuhan, sehingga kebutuhan gizi ikut meningkat.","Jika kebutuhan gizi tidak terpenuhi, remaja berisiko mengalami masalah gizi. Beberapa di antaranya:"],chips:["Anemia","Gizi kurang","Masalah gizi lainnya"],p2:["Sarapan adalah salah satu cara untuk membantu memenuhi kebutuhan gizi remaja. Selain itu, sarapan juga menjadi sumber tenaga untuk memulai aktivitas di pagi hari."],co:{l:"Coba sekarang",g:1,items:["Ingat-ingat: dalam seminggu terakhir, berapa hari kamu sarapan sebelum berangkat sekolah?","Apa alasan utama kamu kadang tidak sempat sarapan?","Tulis satu hal kecil yang bisa kamu ubah mulai besok."]}},
 {n:"1.3",t:"Waktu yang Tepat untuk Sarapan",p:["Sarapan sebaiknya dilakukan pada pagi hari sebelum memulai aktivitas, termasuk sebelum berangkat sekolah. Membiasakan sarapan membantu tubuh mendapat asupan makanan untuk menunjang kegiatan pagi.","Anak kota sering dikejar waktu: macet, antar-jemput, atau jarak sekolah yang jauh. Karena itu, kuncinya adalah persiapan."],groups:[{t:"Malam sebelumnya",c:["Siapkan bahan makanan","Rencanakan menu sarapan agar tidak bingung","Pastikan ada waktu makan sebelum berangkat"]},{t:"Pagi hari",c:["Bangun cukup awal","Siapkan atau ambil sarapan yang sudah direncanakan","Makan dulu sebelum berangkat sekolah"]}],co:{l:"Tips untuk kamu",items:["1. Siapkan bahan makanan pada malam sebelumnya.","2. Rencanakan menu agar tidak bingung di pagi hari.","3. Usahakan menyediakan waktu untuk sarapan sebelum berangkat."]}},
 {n:"1.4",t:"Manfaat Sarapan bagi Aktivitas dan Konsentrasi",p:["Menurut Buku Menu Sarapan Aksi Bergizi, sarapan memiliki enam manfaat bagi remaja:"],chips:["Sumber tenaga","Semangat","Cegah kelelahan","Konsentrasi","Daya tahan tubuh","Cegah jajanan kurang sehat"],ol:["Sumber tenaga: Membantu menyediakan energi untuk memulai aktivitas pagi.","Meningkatkan semangat: Membuatmu lebih bersemangat menjalani aktivitas.","Mencegah kelelahan: Membantu mengurangi risiko kelelahan saat beraktivitas.","Meningkatkan konsentrasi: Menunjang konsentrasi selama kegiatan belajar.","Menjaga daya tahan tubuh: Membantu mendukung kesehatan tubuh.","Mencegah jajanan kurang sehat: Mengurangi kecenderungan memilih jajanan yang kurang sehat."]},
 {n:"1.5",t:"Dampak Melewatkan Sarapan",p:["Melewatkan sarapan termasuk pola makan yang kurang baik pada remaja. Jika sarapan sering dilewatkan, zat gizi yang dibutuhkan tubuh bisa tidak terpenuhi secara optimal.","Hal ini perlu diperhatikan karena kamu sedang tumbuh dan kebutuhan gizimu meningkat. Karena itu, biasakan sarapan dengan menu bergizi seimbang."],mf:[{m:"Remaja sudah besar, jadi tidak perlu sarapan.",f:"Justru remaja sedang tumbuh dan kebutuhan gizinya meningkat."},{m:"Sarapan harus selalu nasi.",f:"Makanan pokok bisa diganti ubi, mi, atau bihun."},{m:"Cukup minum teh manis atau kopi, sudah sarapan.",f:"Minuman manis bukan pengganti makanan. Sarapan perlu menu bergizi yang beragam."}]}],
 sum:["Sarapan adalah makan pagi sebelum beraktivitas.","Remaja sedang tumbuh sehingga kebutuhan gizinya meningkat.","Sarapan membantu tenaga, semangat, dan konsentrasi belajar.","Sarapan membantu mengurangi kebiasaan jajan yang kurang sehat.","Siapkan bahan dan rencanakan menu sejak malam sebelumnya."],
 msg:"Jangan melewatkan sarapan. Awali aktivitas pagi dengan makanan yang bergizi dan beragam."},

{id:2, title:"Mengenal Sarapan Bergizi Seimbang", tag:"Kenali empat komponen menu dan manfaat pangan lokal yang beragam.", min:"3",
 src:"Sumber utama: Buku Menu Sarapan Aksi Bergizi (Kemenkes RI dan UNICEF, 2024), Bab 2, halaman 3–5.",
 goals:["Menjelaskan arti sarapan bergizi seimbang","Menyebutkan 4 komponen menu sarapan","Memahami pentingnya keragaman dan pangan lokal"],
 story:{l:"Cerita pagi Dimas", t:"Dimas selalu sarapan. Tapi menunya itu-itu saja: sepiring nasi dan kerupuk, kadang hanya mi instan. Perutnya kenyang, tapi menu itu belum lengkap. Sarapan yang baik bukan cuma soal kenyang. Ada empat komponen yang saling melengkapi. Yuk, kenali satu per satu."},
 secs:[
 {n:"2.1",t:"Apa Itu Sarapan Bergizi Seimbang?",p:["Sarapan bergizi seimbang adalah hidangan yang mengandung zat gizi dalam jenis dan jumlah yang sesuai dengan kebutuhan tubuh.","Dalam penyusunan menu di buku ini, sarapan direncanakan memenuhi sekitar 15–30% kebutuhan gizi sehari. Buku memakai standar 25% untuk remaja usia 13–15 tahun dan 16–18 tahun."],co:{l:"Ingat",t:"Menu sarapan tidak cukup hanya satu jenis makanan. Kombinasikan beberapa kelompok bahan pangan dalam satu hidangan."}},
 {n:"2.2",t:"Empat Komponen Menu Sarapan",p:["Menu bergizi seimbang terdiri atas empat komponen utama. Bayangkan sebuah piring yang dibagi menjadi empat bagian:"],groups:[{t:"1. Makanan pokok (karbohidrat)",c:["Nasi","Ubi jalar","Mi","Bihun","Roti","Jagung"]},{t:"2. Lauk-pauk (protein)",c:["Ikan","Ayam","Telur","Tempe","Tahu"]},{t:"3. Sayuran (vitamin dan mineral)",c:["Bayam","Kangkung","Wortel","Kacang panjang"]},{t:"4. Buah-buahan (vitamin dan mineral)",c:["Pisang","Jeruk","Pepaya","Semangka","Melon"]}]},
 {n:"2.3",t:"Pentingnya Keragaman Makanan",p:["Susun menu sarapan dari bahan makanan yang beragam. Keragaman membantu tubuh mendapat berbagai zat gizi yang dibutuhkan.","Ibarat tim sepak bola, setiap pemain punya peran. Kalau hanya ada penyerang, tim tidak seimbang. Begitu juga sarapan: tiap kelompok bahan pangan punya perannya sendiri.","Tukar-tukar menu: Makanan pokok tidak harus selalu nasi. Lauk, sayur, dan buah pun bisa divariasikan setiap hari."],table:{h:["Komponen","Boleh diganti dengan"],r:[["Makanan pokok","Nasi, ubi, mi, bihun, roti, jagung"],["Lauk","Ikan, ayam, telur, tempe, tahu"],["Sayur","Bayam, kangkung, wortel, kacang panjang"],["Buah","Pisang, jeruk, pepaya, semangka, melon"]]},p2:["Buku juga menganjurkan bahan pangan lokal. Selain mudah diperoleh, bahan lokal bisa diolah menjadi menu menarik yang sesuai dengan kebiasaan makan remaja."]},
 {n:"2.4",t:"Cek Piringmu",mf:[{m:"Sayur hanya untuk makan siang atau malam.",f:"Sayur termasuk komponen menu sarapan bergizi seimbang."},{m:"Sarapan cukup satu jenis makanan asal kenyang.",f:"Menu sarapan perlu mengombinasikan beberapa kelompok bahan pangan."}],co:{l:"Coba sekarang: Cek sarapan kemarin",g:1,items:["Apakah ada makanan pokok?","Apakah ada lauk (hewani atau nabati)?","Apakah ada sayur?","Apakah ada buah?","Berapa komponen yang sudah ada, dan mana yang belum?"]}}],
 sum:["Sarapan bergizi seimbang mengandung zat gizi dalam jenis dan jumlah yang sesuai kebutuhan.","Ada 4 komponen: makanan pokok, lauk-pauk, sayur, dan buah.","Lauk bisa hewani maupun nabati, dan boleh dikombinasikan.","Makanan pokok tidak harus nasi.","Bahan pangan lokal mudah didapat dan bisa diolah jadi menu menarik."],
 msg:"Lengkapi sarapan dengan makanan pokok, lauk-pauk, sayur, dan buah agar menu lebih beragam."},

{id:3, title:"Mengenal Sumber Zat Gizi dalam Sarapan", tag:"Dari karbohidrat sampai vitamin: temukan gizi di setiap piring sarapan.", min:"4",
 src:"Sumber utama: Buku Menu Sarapan Aksi Bergizi (Kemenkes RI dan UNICEF, 2024), Bab 3 halaman 7–12 dan Bab 6 halaman 30–35.",
 goals:["Mengenali bahan makanan sumber karbohidrat","Membedakan protein hewani dan nabati","Memahami peran sayur, buah, dan minuman"],
 story:{l:"Detektif gizi", t:"Bayangkan sarapanmu adalah sebuah misteri. Di balik sepiring nasi, telur, tumis bayam, dan pepaya, ada berbagai zat gizi yang bekerja untuk tubuhmu. Mari berperan sebagai detektif gizi dan temukan siapa memberi apa."},
 secs:[
 {n:"3.1",t:"Mengenal Sumber Karbohidrat",p:["Makanan pokok adalah komponen utama menu sarapan dan menjadi sumber karbohidrat. Karbohidrat tidak hanya berasal dari nasi; ada banyak pilihan pengganti."],chips:["Nasi","Ubi","Mi","Bihun","Kentang","Singkong","Roti","Jagung"],p2:["Dengan banyak pilihan ini, sarapanmu bisa lebih bervariasi tanpa harus selalu memakai nasi.","Variasi sumber karbohidrat: Satu kelompok bahan, banyak pilihan. Kamu bisa bergantian memilih nasi, ubi, mi, bihun, kentang, singkong, roti, atau jagung dari hari ke hari. Pilih sesuai ketersediaan bahan dan seleramu."],co:{l:"Tahukah kamu?",t:"Bosan dengan nasi? Besok coba ubi rebus, bihun goreng sayur, roti, atau jagung rebus. Sama-sama sumber karbohidrat, rasanya beda."}},
 {n:"3.2",t:"Protein Hewani dan Nabati",p:["Protein bisa diperoleh dari bahan pangan hewani maupun nabati. Lauk-pauk dapat memakai salah satu atau kombinasi keduanya."],groups:[{t:"Protein hewani: berasal dari hewan",c:["Ayam","Ikan","Telur","Udang","Daging"]},{t:"Protein nabati: berasal dari tumbuhan",c:["Tempe","Tahu","Kacang kedelai","Kacang hijau","Kacang merah","Oncom"]}],co:{l:"Contoh kombinasi",t:"Nasi + telur + tempe, atau nasi + ikan + tumis sayuran. Hewani dan nabati bisa bergandengan dalam satu piring.",g:1}},
 {n:"3.3",t:"Peran Sayur dan Buah",p:["Buku Menu Sarapan Aksi Bergizi mengelompokkan sayuran dan buah sebagai sumber vitamin dan mineral. Selain itu, sayur dan buah juga merupakan sumber serat. Ketiganya penting dalam sarapan bergizi seimbang."],groups:[{t:"Contoh sayuran",c:["Bayam","Kangkung","Wortel","Brokoli","Buncis","Kacang panjang","Sawi"]},{t:"Contoh buah-buahan",c:["Pisang","Jeruk","Pepaya","Apel","Semangka","Melon","Mangga"]}],p2:["Menambah sayur dan buah membuat bahan pangan yang kamu makan lebih beragam. Usahakan selalu menyertakannya dalam sarapan sehari-hari."],co:{l:"Peran sayur dan buah",t:"Vitamin dan mineral: ada pada sayur dan buah. Serat: juga berasal dari sayur dan buah, dan membantu menjaga kesehatan pencernaan."},co2:{l:"Tahukah kamu?",t:"Coba buat sarapan yang berwarna: hijau dari sayur, oranye dari wortel atau jeruk, kuning dari pisang. Makin beragam warnanya, makin beragam bahan pangannya."}},
 {n:"3.4",t:"Pilihan Minuman Saat Sarapan",p:["Minuman bisa menjadi pelengkap sarapan. Air putih adalah pilihan untuk membantu memenuhi kebutuhan cairan tubuh. Susu juga termasuk dalam daftar kelompok bahan makanan pada buku."],chips:["Air putih","Susu"],co:{l:"Tips memilih minuman",items:["Utamakan air putih.","Batasi minuman dengan tambahan gula berlebihan.","Jangan menjadikan minuman manis sebagai pengganti makanan utama."]},co2:{l:"Coba sekarang: Jadi detektif gizi",g:1,items:["Tulis menu sarapan terakhirmu.","Tandai mana sumber karbohidrat, protein, serta vitamin, mineral, dan serat.","Mana yang masih kurang? Apa yang bisa kamu tambahkan?"]}}],
 sum:["Makanan pokok adalah sumber karbohidrat: nasi, ubi, mi, bihun, kentang, singkong, roti, jagung.","Protein berasal dari hewan (ayam, ikan, telur) dan tumbuhan (tempe, tahu, kacang-kacangan).","Sayur dan buah adalah sumber vitamin, mineral, dan serat.","Utamakan air putih dan batasi minuman bergula."],
 msg:"Lengkapi menu sarapan dengan sumber karbohidrat, protein, sayur, dan buah, serta pilih minuman yang sesuai."},

{id:4, title:"Menyusun Menu Sarapan Bergizi Seimbang", tag:"Padukan bahan makanan menjadi menu sarapan yang lengkap dan menarik.", min:"4",
 src:"Sumber utama: Buku Menu Sarapan Aksi Bergizi (Kemenkes RI dan UNICEF, 2024), Bab 2 halaman 3–6 dan Bab 7 halaman 38–77.",
 goals:["Menyusun menu dari 4 komponen utama","Membuat variasi menu dari bahan lokal","Memahami standar porsi sarapan"],
 story:{l:"Rumus sarapan", t:"Makanan pokok + Lauk + Sayur + Buah = Sarapan bergizi seimbang. Itu saja rumusnya. Sisanya tinggal berkreasi dengan bahan yang ada di dapurmu, warung dekat rumah, atau pasar di sekitarmu."},
 secs:[
 {n:"4.1",t:"Contoh Kombinasi Menu Sarapan",p:["Menu sarapan disusun dengan mengombinasikan makanan pokok, lauk-pauk, sayur, dan buah. Berikut lima contoh menu dari Buku Menu Sarapan Aksi Bergizi:"],menus:[["Menu 1: Nasi Kuning","Nasi kuning, ikan goreng rica, tumis kacang panjang campur tempe, jeruk"],["Menu 2: Mi Goreng Komplit","Mi goreng komplit, telur ceplok, pisang"],["Menu 3: Nasi Putih","Nasi putih, ikan kuah kuning, tumis daun singkong, pisang"],["Menu 4: Nasi Pecel","Nasi pecel sayur, telur dadar, jeruk"],["Menu 5: Ubi Rebus","Ubi rebus, ikan goreng rica, tumis daun gedi, jeruk"]],p2:["Contoh-contoh ini memakai bahan pangan lokal dan berbagai kombinasi makanan."]},
 {n:"4.2",t:"Variasi Bahan Makanan",p:["Variasi membuat menu tidak monoton. Kamu bisa merencanakan menu untuk beberapa hari atau satu minggu sekaligus."],table:{h:["Komponen","Variasi bahan"],r:[["Makanan pokok","Nasi, ubi, mi, bihun, roti, jagung"],["Lauk hewani","Ayam, ikan, telur"],["Lauk nabati","Tempe, tahu, kacang-kacangan"],["Sayur","Bayam, kangkung, wortel, buncis"],["Buah","Pisang, jeruk, pepaya, semangka"]]},p2:["Saat membuat variasi, pertimbangkan ketersediaan bahan pangan, kebiasaan makan, dan seleramu. Bahan pangan lokal membuat menu lebih mudah dibuat dan sesuai kondisi setempat."],co:{l:"Tips menu praktis",items:["Pilih bahan yang mudah didapat di sekitar rumah.","Siapkan bahan sejak malam sebelumnya.","Rencanakan menu untuk beberapa hari sekaligus."]}},
 {n:"4.3",t:"Penyesuaian Porsi Sarapan",p:["Setiap kelompok umur punya kebutuhan gizi berbeda. Buku menggunakan standar sarapan sekitar 25% kebutuhan gizi harian remaja usia 13–15 dan 16–18 tahun, dengan standar bahan (berat matang) berikut:"],stats:[["200 g","Makanan pokok"],["70 g","Lauk hewani / nabati"],["50 g","Sayur"],["75 g","Buah"]],co:{l:"Catatan",t:"Angka ini adalah standar perencanaan menu dalam buku, bukan aturan bahwa setiap siswa harus makan porsi yang persis sama.",g:1},p2:["Porsi sarapan disesuaikan dengan kebutuhanmu. Porsi sarapan tidak berdiri sendiri. Ada tiga hal yang perlu kamu ingat:"],steps:["Kebutuhan tiap orang berbeda: Kebutuhan gizi berbeda menurut kelompok umur, dan setiap siswa punya kebutuhan masing-masing. Porsi bisa disesuaikan, tidak harus sama persis.","Sarapan adalah bagian dari makan sehari: Standar buku sekitar 25% kebutuhan gizi harian. Sisanya dipenuhi dari makan siang, makan malam, dan selingan.","Lihat gambaran sehari penuh: Menilai porsi sarapan berarti melihatnya bersama kebutuhan makan sehari secara keseluruhan."]},
 {n:"4.4",t:"Contoh Menu Sarapan Remaja",p:["Gunakan empat contoh berikut sebagai inspirasi menyusun sarapanmu:"],menus:[["Menu A","Nasi, telur dadar, tumis bayam, pepaya"],["Menu B","Ubi rebus, ikan goreng, tumis sayuran, jeruk"],["Menu C","Nasi, ayam, tempe, sup sayuran, pisang"],["Menu D","Bihun goreng sayur, telur, pisang"]],co:{l:"Coba sekarang: Rakit menumu",g:1,items:["Pilih 1 makanan pokok.","Pilih 1 lauk hewani dan/atau nabati.","Pilih 1 sayur.","Pilih 1 buah.","Beri nama menumu, lalu coba buat besok pagi!"]}}],
 sum:["Rumus menu: makanan pokok + lauk + sayur + buah.","Variasi menu membuat sarapan tidak membosankan.","Bahan pangan lokal mudah didapat dan mudah diolah.","Standar sarapan di buku: pokok 200 g, lauk 70 g, sayur 50 g, buah 75 g.","Porsi disesuaikan dengan kebutuhan masing-masing dan kebutuhan makan sehari secara keseluruhan.","Rencanakan menu untuk beberapa hari atau seminggu."],
 msg:"Susun menu sarapan yang beragam, mudah disiapkan, memakai bahan pangan lokal, dan memperhatikan kebutuhan porsi."},

{id:5, title:"Merencanakan Sarapan dengan Breakfast Planner", tag:"Rencanakan, catat, dan evaluasi sarapanmu langkah demi langkah.", min:"4",
 src:"Sumber utama: Buku Menu Sarapan Aksi Bergizi (Kemenkes RI dan UNICEF, 2024), Bab 2 halaman 4–6. Fitur perencanaan dan pencatatan mengikuti fungsi aplikasi Digital Breakfast Planner.",
 goals:["Memahami alasan merencanakan menu sarapan","Memilih komponen menu langkah demi langkah","Mencatat dan mengevaluasi sarapan di aplikasi"],
 story:{l:"Misi seminggu", t:"Kamu sudah tahu apa itu sarapan bergizi seimbang, apa saja komponennya, dan cara menyusun menunya. Sekarang saatnya beraksi. Dengan aplikasi Digital Breakfast Planner, kamu akan merencanakan sarapan, mencatat yang benar-benar kamu makan, lalu mengevaluasinya."},
 secs:[
 {n:"5.1",t:"Mengapa Perlu Merencanakan Menu?",p:["Menu sarapan bisa direncanakan sejak awal untuk dijalankan setiap minggu. Tujuannya agar kamu tidak bosan dengan menu yang dimakan.","Hal yang perlu diperhatikan saat merencanakan menu:"],ul:["Ketersediaan bahan pangan","Kebiasaan makan","Selera atau kesukaan","Keragaman bahan pangan","Kesesuaian menu dengan kebutuhan gizi"],p2:["Lewat aplikasi Digital Breakfast Planner, kamu bisa merencanakan menu sarapan untuk esok hari."]},
 {n:"5.2",t:"Menentukan Makanan Pokok",p:["Langkah pertama adalah memilih makanan pokok sebagai sumber karbohidrat. Tidak harus nasi; pilih sesuai ketersediaan bahan dan kesukaanmu."],chips:["Nasi","Ubi jalar","Mi","Bihun","Kentang","Singkong","Roti","Jagung"]},
 {n:"5.3",t:"Memilih Lauk Hewani atau Nabati",p:["Lanjutkan dengan memilih lauk-pauk. Kedua jenis lauk boleh dikombinasikan agar menu lebih beragam."],groups:[{t:"Protein hewani",c:["Ikan","Ayam","Telur","Udang"]},{t:"Protein nabati",c:["Tempe","Tahu","Kacang hijau","Kacang merah"]}]},
 {n:"5.4",t:"Menambahkan Sayur dan Buah",p:["Sayur dan buah tidak boleh dilupakan. Kombinasinya membantu menambah keragaman zat gizi dalam sarapanmu."],groups:[{t:"Sayur",c:["Bayam","Wortel","Kangkung","Buncis"]},{t:"Buah",c:["Pisang","Jeruk","Pepaya","Apel"]}]},
 {n:"5.5",t:"Memilih Minuman",p:["Minuman bisa direncanakan sebagai pelengkap sarapan. Pilihannya antara lain air putih dan susu. Utamakan yang sesuai kebutuhan tubuh dan batasi minuman dengan tambahan gula berlebihan."],chips:["Air putih","Susu"]},
 {n:"5.6",t:"Merencanakan dan Mencatat Sarapan",p:["Setelah memahami komponen menu bergizi seimbang, ikuti enam langkah ini di aplikasi Digital Breakfast Planner:"],ol:["Rencanakan menu sarapan: Tentukan menu yang akan dimakan besok.","Pilih komponen makanan: Makanan pokok, lauk hewani dan/atau nabati, sayur, dan buah.","Tentukan minuman: Pilih minuman yang cocok untuk melengkapi sarapan.","Simpan rencana menu: Simpan di aplikasi sebagai panduan saat menyiapkan sarapan.","Catat yang benar-benar dimakan: Setelah sarapan, catat makanan dan minuman yang kamu konsumsi.","Evaluasi kesesuaian menu: Bandingkan rencana dengan yang dimakan: apakah sudah terlaksana?"]},
 {n:"5.7",t:"Contoh Rencana dan Realisasi",p:["Contoh bagaimana rencana dibandingkan dengan yang benar-benar dimakan (contoh ilustrasi):"],table:{h:["Komponen","Rencana","Dimakan"],r:[["Makanan pokok","Nasi","Nasi"],["Lauk","Telur dadar","Telur dadar"],["Sayur","Tumis bayam","Tidak ada"],["Buah","Pepaya","Pisang"],["Minuman","Air putih","Air putih"]]},p2:["Dari contoh ini kamu bisa melihat: sebagian besar rencana terlaksana, tetapi sayur belum ada dan buah diganti. Evaluasi seperti ini membantumu memperbaiki rencana berikutnya."],co:{l:"Tantangan 7 hari",g:1,items:["Rencanakan sarapan setiap malam.","Catat yang benar-benar kamu makan setiap pagi.","Evaluasi: berapa hari rencanamu terlaksana?","Isi lembar rencana mingguan di halaman berikut."]}},
 {n:"5.8",t:"Lembar Rencana Sarapan Mingguan",p:["Isi lembar ini setiap minggu. Tulis menu yang kamu rencanakan, lalu beri tanda centang jika benar-benar kamu makan. Merencanakan satu minggu sekaligus membuat belanja bahan dan persiapan lebih mudah."],table:{h:["Hari","Rencana menu sarapan","Dimakan?"],r:[["Senin","Contoh: Nasi kuning, telur, tumis bayam, jeruk","✓"],["Selasa","Contoh: Ubi rebus, ikan, sayur, pisang","✓"],["Rabu","(Rencana diisi di menu Planner)","—"],["Kamis","(Rencana diisi di menu Planner)","—"],["Jumat","(Rencana diisi di menu Planner)","—"],["Sabtu","(Rencana diisi di menu Planner)","—"],["Minggu","(Rencana diisi di menu Planner)","—"]]},p2:["Di aplikasi Digital Breakfast Planner, lembar ini otomatis terhubung dengan fitur Planner dan Food record."]}],
 sum:["Rencanakan menu sejak awal agar tidak bosan.","Pilih makanan pokok, lauk, sayur, buah, dan minuman.","Simpan rencana, lalu catat yang benar-benar dimakan.","Bandingkan rencana dan realisasi untuk evaluasi."],
 msg:"Jangan hanya merencanakan sarapan. Usahakan untuk mewujudkan rencana itu dalam konsumsi sehari-hari."}
];

function secHtml(s){
  var h='<section class="sec" id="sec-'+s.n.replace('.','-')+'"><h2><em>'+s.n+'</em>'+esc(s.t)+'</h2>';
  (s.p||[]).forEach(function(p){h+='<p>'+esc(p)+'</p>';});
  if(s.chips)h+='<div class="chips" aria-hidden="false">'+s.chips.map(function(c){return '<span class="pill ok" style="font-size:13px;padding:7px 12px">'+esc(c)+'</span>';}).join('')+'</div>';
  if(s.groups)s.groups.forEach(function(g){h+='<div><p class="sub3">'+esc(g.t)+'</p><div class="chips">'+g.c.map(function(c){return '<span class="pill ok" style="font-size:13px;padding:7px 12px">'+esc(c)+'</span>';}).join('')+'</div></div>';});
  if(s.stats)h+='<div class="stats">'+s.stats.map(function(x){return '<div><strong>'+x[0]+'</strong><span>'+esc(x[1])+'</span></div>';}).join('')+'</div>';
  if(s.menus)h+='<div class="menus">'+s.menus.map(function(m){return '<div><strong>'+esc(m[0])+'</strong><span>'+esc(m[1])+'</span></div>';}).join('')+'</div>';
  if(s.table)h+='<div style="overflow-x:auto"><table class="tbl"><thead><tr>'+s.table.h.map(function(x){return '<th scope="col">'+esc(x)+'</th>';}).join('')+'</tr></thead><tbody>'+s.table.r.map(function(r){return '<tr>'+r.map(function(c){return '<td>'+esc(c)+'</td>';}).join('')+'</tr>';}).join('')+'</tbody></table></div>';
  if(s.ul)h+='<ul class="ul">'+s.ul.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul>';
  if(s.ol)h+='<ol class="ol">'+s.ol.map(function(x){return '<li><span>'+esc(x)+'</span></li>';}).join('')+'</ol>';
  if(s.steps)h+='<ol class="ol">'+s.steps.map(function(x){return '<li><span>'+esc(x)+'</span></li>';}).join('')+'</ol>';
  if(s.mf)h+='<div class="mf">'+s.mf.map(function(x){return '<div><div class="m"><b>MITOS</b>'+esc(x.m)+'</div><div class="f"><b>FAKTA</b>'+esc(x.f)+'</div></div>';}).join('')+'</div>';
  (s.p2||[]).forEach(function(p){h+='<p>'+esc(p)+'</p>';});
  function renderCo(co){
    if(!co) return '';
    var ch='<div class="callout'+(co.g?' green':'')+'"><b>'+esc(co.l)+'</b>';
    if(co.t) ch+='<p>'+esc(co.t)+'</p>';
    if(co.items) ch+='<ul class="ul" style="font-size:14px;margin:4px 0 0;padding-left:18px">'+co.items.map(function(it){return '<li>'+esc(it)+'</li>';}).join('')+'</ul>';
    ch+='</div>';
    return ch;
  }
  if(s.co) h+=renderCo(s.co);
  if(s.co2) h+=renderCo(s.co2);
  return h+'</section>';
}

function syncRead(){ // meniru trigger: semua buku wajib terbaca -> MENUNGGU_VERIFIKASI
  if(S.status==="EDUKASI" && readCount()===BOOKS.length) S.status="MENUNGGU_VERIFIKASI";
}
function jump(to){
  function all(){BOOKS.forEach(function(b){S.read[b.id]=true;});}
  if(to==="login"||to==="register"||to==="pretest"){
    S.status="PRETEST"; S.read={}; S.preDone=false; S.pq=0; S.ans=[null,null,null,null,null]; S.errors={};
  } else if(to==="materi"||to==="baca"){
    S.status="EDUKASI"; S.preDone=true; if(S.score==null)S.score=80;
    S.read=(to==="baca")?{}:{1:true,2:true}; S.book=1;
  } else if(to==="tunggu"){
    all(); S.status="MENUNGGU_VERIFIKASI"; S.preDone=true; if(S.score==null)S.score=80;
  } else {
    all(); S.status="TERVERIFIKASI"; S.preDone=true; if(S.score==null)S.score=80;
  }
  S.screen=to; render();
}
function validate(){
  var f=S.form, e={};
  if(f.nama.trim().length<3)e.nama="Tulis nama lengkapmu.";
  if(!f.jk)e.jk="Pilih jenis kelamin.";
  var m=/^(\d{2})\/(\d{2})\/(\d{4})$/.exec(f.tgl);
  if(!m)e.tgl="Tulis tanggal lahir dengan format hh/bb/tttt.";
  else { var d=+m[1],mo=+m[2],y=+m[3], dt=new Date(y,mo-1,d); if(dt.getFullYear()!==y||dt.getMonth()!==mo-1||dt.getDate()!==d||y<1990||dt>new Date())e.tgl="Tanggal lahir tidak valid."; }
  if(f.sekolah.trim().length<3)e.sekolah="Tulis asal sekolahmu.";
  if(!/^\S+@\S+\.\S+$/.test(f.email))e.email="Tulis email yang valid, misalnya nama@email.com.";
  if(f.sandi.length<8)e.sandi="Kata sandi minimal 8 karakter.";
  if(f.kelas.trim().length<1)e.kelas="Tulis kelasmu.";
  S.errors=e; return Object.keys(e).length===0;
}

document.addEventListener("click",function(ev){
  var el=ev.target.closest("[data-act]"); if(!el||el.disabled)return;
  var a=el.dataset.act, d=el.dataset;
  switch(a){
   case "go": S.screen=d.to; if(d.to==="login"||d.to==="register"){S.errors={};} render(); break;
   case "jump": jump(d.to); break;
   case "login": S.screen=route(); if(S.status==="PRETEST"){S.pq=0;} render(); break;
   case "jk": S.form.jk=d.v; delete S.errors.jk; render(); break;
   case "register": if(validate()){S.status="PRETEST";S.pq=0;S.preDone=false;S.screen="pretest";render();} else {render(); var bad=$("#phone .inp.bad"); if(bad)bad.focus();} break;
   case "ans": S.ans[S.pq]=+d.i; render(); break;
   case "prev": S.pq=Math.max(0,S.pq-1); render(); break;
   case "next":
     if(S.pq<QUIZ.length-1){S.pq++;render();}
     else { var c=0; QUIZ.forEach(function(q,i){if(S.ans[i]===q.a)c++;}); S.score=Math.round(c/QUIZ.length*100); S.preDone=true; render(); }
     break;
   case "toMateri": S.status="EDUKASI"; syncRead(); S.screen="materi"; render(); break;
   case "open": S.book=+d.id; S.screen="baca"; render(); break;
   case "back": S.screen="materi"; render(); break;
   case "sec": var t=$("#sec-"+d.n); if(t)t.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"start"}); break;
   case "markRead":
     if(!S.read[S.book]){ S.read[S.book]=true; syncRead(); S.screen="materi"; render(); toast("Buku "+S.book+" selesai dibaca"+(S.status==="MENUNGGU_VERIFIKASI"?". Semua materi wajib selesai.":".")); }
     else { S.screen="materi"; render(); }
     break;
   case "toTunggu": S.screen="tunggu"; render(); break;
   case "cek":
     if(S.status==="TERVERIFIKASI"){S.screen="beranda";render();}
     else toast("Belum terverifikasi. Petugas masih menyelesaikan SQ-FFQ.");
     break;
   case "pick": S.plan[d.k]=(S.plan[d.k]===d.v?null:d.v); S.plan.saved=false; render(); break;
   case "jam": S.plan.jam=d.v; render(); break;
   case "tempat": S.plan.tempat=d.v; render(); break;
   case "savePlan": S.plan.saved=true; S.fr.items=null; S.screen="beranda"; render(); toast("Rencana untuk Rabu pagi tersimpan."); break;
   case "tidak": S.fr.tidak=!S.fr.tidak; render(); break;
   case "frs": var it=S.fr.items[+d.i]; it.st=d.v; render(); break;
   case "frAdd": S.fr.items.push({k:"lain",nama:"Makanan tambahan",urt:"1 porsi",gram:"50",st:"d",ket:"",custom:true}); render(); break;
   case "saveFR":
     var its=S.fr.items||[], st;
     if(S.fr.tidak) st="tidak";
     else { var n=its.filter(function(x){return x.st==="s";}).length; st=(its.length&&n===its.length)?"sesuai":(n>0?"sebagian":"tidak"); }
     S.todayStatus=st; S.fr.saved=true; S.screen="beranda"; render(); toast("Catatan tersimpan. Hasil masuk ke rekap."); break;
   case "week": S.week=+d.v; S.day=null; render(); break;
   case "day": S.day=(S.day===+d.i?null:+d.i); render(); break;
   case "fill":
     S.form={nama:"Aisyah Putri",jk:"Perempuan",tgl:"14/03/2009",sekolah:"SMAN 1 Jakarta",email:"aisyah@email.com",sandi:"sarapan123",kelas:"XI IPA 2"}; S.errors={}; render(); break;
   case "verify": if(S.status==="MENUNGGU_VERIFIKASI"){S.status="TERVERIFIKASI"; S.screen="beranda"; render(); toast("Petugas menyelesaikan SQ-FFQ. Akun terverifikasi.");} break;
   case "reset": S=fresh(); render(); break;
  }
});
document.addEventListener("input",function(ev){
  var t=ev.target;
  if(t.dataset.f){
    var k=t.dataset.f; if(k==="lemail"||k==="lsandi")return;
    if(k==="tgl"){ var v=t.value.replace(/\D/g,"").slice(0,8); var o=v; if(v.length>4)o=v.slice(0,2)+"/"+v.slice(2,4)+"/"+v.slice(4); else if(v.length>2)o=v.slice(0,2)+"/"+v.slice(2); t.value=o; }
    S.form[k]=t.value;
    if(S.errors[k]){delete S.errors[k]; var p=$("#e-"+k); if(p)p.remove(); t.classList.remove("bad"); t.removeAttribute("aria-invalid");}
  } else if(t.dataset.fr){ S.fr[t.dataset.fr]=t.value; }
  else if(t.dataset.fi!==undefined){ var it=S.fr.items[+t.dataset.fi]; it[t.dataset.k]=t.value; }
});

/* ================= Ukuran perangkat ================= */
function fit(){
  var vw=document.documentElement.clientWidth, vh=window.innerHeight, s;
  if(vw>=960){ s=Math.min(1,(vh-48)/864,(vw-320-32-64)/410); }
  else { s=Math.min(1,(vw-32)/410); }
  document.documentElement.style.setProperty("--s",Math.max(.4,s).toFixed(3));
}
window.addEventListener("resize",fit); fit();
render();
})();
</script>
